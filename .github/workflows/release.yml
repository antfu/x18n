name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: sxzz/workflows/.github/workflows/release.yml@main
    with:
      publish: true
      # Build before publishing so `packages/cli/skills` (copied by the tsdown hook) exists when files are packed.
      build: pnpm build
    permissions:
      contents: write
      id-token: write

  # Publishes the VS Code extension to the Marketplace, Open VSX and the GitHub
  # release. Runs after `release`, which creates the release page vsxpub uploads to.
  extension:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install

      - name: Package extension
        working-directory: packages/vscode
        run: |
          pnpm run ext:package
          version=$(node -p "require('./package.json').version")
          mv x18n.vsix "x18n-$version.vsix"

      - name: Publish extension
        working-directory: packages/vscode
        run: pnpm exec vsxpub --name x18n --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --no-dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  # Opens a pull request on zed-industries/extensions that points the Zed registry at this tag.
  # The registry builds the extension from `packages/zed` itself. Skipped when nothing in
  # `packages/zed` changed since the previous tag apart from the version bump, since the
  # extension installs the latest `@x18n/lsp` on its own.
  zed:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Zed extension changes
        id: changes
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$prev" ] && git diff --quiet "$prev" HEAD -- packages/zed ':!packages/zed/extension.toml'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the Zed registry pull request
        if: steps.changes.outputs.changed == 'true'
        uses: huacnlee/zed-extension-action@v2
        with:
          extension-name: x18n-language-server
          push-to: x18n-dev/extensions
        env:
          # Classic PAT with `repo` and `workflow` scopes that can push to `push-to`.
          COMMITTER_TOKEN: ${{ secrets.ZED_COMMITTER_TOKEN }}
