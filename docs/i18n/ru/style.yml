rules:
  - 'Write Russian for developers in a neutral technical register. Address the reader as "вы" (lowercase) and use the imperative for instructions ("Запустите", "Добавьте").'
  - Use guillemets («») for quoted prose and the em dash with spaces for dashes in prose.
  - 'Use established Russian IT terms; keep English terms that Russian developers use as is (CI, pull request, monorepo) when there is no common Russian equivalent.'
  - 'Keep code identifiers, file and directory names, package names, CLI commands and flags, configuration keys, check ids and error codes in English.'
  - 'Keep the names of i18n libraries and frameworks (vue-i18n, i18next, next-intl, Nuxt, React, Angular, ...) in English.'
  - Translate headings concisely; do not add terminal punctuation to headings.
