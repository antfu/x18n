# zh-Hans terms that need diglot-only fields (`match`, `decision: keep` for this locale only); an entry here replaces the shared one in ../glossary.yml.
terms:
  - term: agent
    note: an AI coding agent, such as Claude Code or Cursor; keep "agent" or "agents" in English
    match: \bagents?\b
    decision: keep
  - term: key
    note: a message identifier such as `nav.home`, not a keyboard key or a password
    match: \bkeys?\b
    decision: translate
    target: 键
  - term: usage
    note: one occurrence of a key in source code
    match: \busages?\b
    decision: translate
    target: 引用
  - term: surface
    note: a user-facing layer on the core - the CLI, the language server, the VS Code extension, the UI or MCP
    match: \bsurfaces?\b
    decision: translate
    target: 界面
